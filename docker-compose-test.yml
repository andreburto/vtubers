version: '3.8'
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile_test.go
    depends_on:
      - mongodb
    entrypoint: /app/vtubers
    env_file: .env
  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    volumes:
      - ./mongodb_data:/data/db
    env_file: .env