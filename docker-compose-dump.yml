version: '3.8'
services:
  dump:
    build:
      context: .
      dockerfile: Dockerfile.nodejs
    depends_on:
      - mongodb
    entrypoint: npm run dump
    env_file: .env
  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    volumes:
      - ./mongodb_data:/data/db
    env_file: .env